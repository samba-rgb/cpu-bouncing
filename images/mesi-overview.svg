<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <rect width="100%" height="100%" fill="#fffdf8"/>
  <text x="90" y="90" font-size="42" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#1f2937">MESI in one picture</text>
  <text x="90" y="130" font-size="24" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#4b5563">A cache line lives in one of four states inside a core cache.</text>

  <rect x="90" y="210" width="320" height="220" rx="22" fill="#dff7e5" stroke="#166534" stroke-width="4"/>
  <text x="125" y="275" font-size="38" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#166534">M = Modified</text>
  <text x="125" y="335" font-size="24" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#374151">Only this core has it.</text>
  <text x="125" y="375" font-size="24" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#374151">This core already wrote it.</text>

  <rect x="450" y="210" width="320" height="220" rx="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <text x="485" y="275" font-size="38" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#1d4ed8">E = Exclusive</text>
  <text x="485" y="335" font-size="24" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#374151">Only this core has it.</text>
  <text x="485" y="375" font-size="24" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#374151">No write happened yet.</text>

  <rect x="810" y="210" width="320" height="220" rx="22" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <text x="845" y="275" font-size="38" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#b45309">S = Shared</text>
  <text x="845" y="335" font-size="24" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#374151">Many cores may have it.</text>
  <text x="845" y="375" font-size="24" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#374151">Nobody owns it for writing.</text>

  <rect x="1170" y="210" width="320" height="220" rx="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/>
  <text x="1205" y="275" font-size="38" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#b91c1c">I = Invalid</text>
  <text x="1205" y="335" font-size="24" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#374151">This cached copy is dead.</text>
  <text x="1205" y="375" font-size="24" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#374151">The core must fetch again.</text>

  <path d="M 360 470 Q 800 560 1240 470" stroke="#6b7280" stroke-width="4" fill="none"/>
  <text x="565" y="565" font-size="28" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#374151">To write, a core must first own the line.</text>

  <rect x="160" y="650" width="1280" height="180" rx="24" fill="#111827"/>
  <text x="210" y="720" font-size="34" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#ffffff">Why this matters</text>
  <text x="210" y="775" font-size="28" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#d1d5db">A relaxed atomic increment still writes.</text>
  <text x="210" y="815" font-size="28" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#d1d5db">A write still needs ownership.</text>
</svg>
