<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080">
  <rect width="100%" height="100%" fill="#fffdf7"/>

  <text x="80" y="80" font-size="40" font-family="Helvetica, Arial, sans-serif" fill="#111827">False Sharing vs Padded Counters</text>
  <text x="80" y="125" font-size="24" font-family="Helvetica, Arial, sans-serif" fill="#4b5563">Different variables can still fight if they are placed on the same cache line.</text>

  <text x="140" y="210" font-size="32" font-family="Helvetica, Arial, sans-serif" fill="#b91c1c">Adjacent counters</text>
  <rect x="130" y="245" width="520" height="210" rx="22" fill="#fff1f2" stroke="#b91c1c" stroke-width="4"/>
  <rect x="170" y="295" width="95" height="78" fill="#fecdd3" stroke="#b91c1c" stroke-width="2"/>
  <rect x="265" y="295" width="95" height="78" fill="#fecdd3" stroke="#b91c1c" stroke-width="2"/>
  <rect x="360" y="295" width="95" height="78" fill="#fecdd3" stroke="#b91c1c" stroke-width="2"/>
  <rect x="455" y="295" width="95" height="78" fill="#fecdd3" stroke="#b91c1c" stroke-width="2"/>
  <text x="205" y="343" font-size="22" font-family="Helvetica, Arial, sans-serif" fill="#111827">T0</text>
  <text x="300" y="343" font-size="22" font-family="Helvetica, Arial, sans-serif" fill="#111827">T1</text>
  <text x="395" y="343" font-size="22" font-family="Helvetica, Arial, sans-serif" fill="#111827">T2</text>
  <text x="490" y="343" font-size="22" font-family="Helvetica, Arial, sans-serif" fill="#111827">T3</text>
  <text x="170" y="408" font-size="21" font-family="Helvetica, Arial, sans-serif" fill="#374151">Several thread counters fit inside one cache line.</text>

  <line x1="220" y1="485" x2="220" y2="575" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrowRed)"/>
  <line x1="315" y1="485" x2="315" y2="575" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrowRed)"/>
  <line x1="410" y1="485" x2="410" y2="575" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrowRed)"/>
  <line x1="505" y1="485" x2="505" y2="575" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="150" y="630" font-size="24" font-family="Helvetica, Arial, sans-serif" fill="#b91c1c">One write can invalidate the line for the others.</text>

  <text x="860" y="210" font-size="32" font-family="Helvetica, Arial, sans-serif" fill="#0f766e">Padded counters</text>
  <rect x="850" y="245" width="520" height="210" rx="22" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
  <rect x="885" y="285" width="78" height="95" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <rect x="1000" y="285" width="78" height="95" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <rect x="1115" y="285" width="78" height="95" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <rect x="1230" y="285" width="78" height="95" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <text x="913" y="343" font-size="22" font-family="Helvetica, Arial, sans-serif" fill="#111827">T0</text>
  <text x="1028" y="343" font-size="22" font-family="Helvetica, Arial, sans-serif" fill="#111827">T1</text>
  <text x="1143" y="343" font-size="22" font-family="Helvetica, Arial, sans-serif" fill="#111827">T2</text>
  <text x="1258" y="343" font-size="22" font-family="Helvetica, Arial, sans-serif" fill="#111827">T3</text>
  <text x="885" y="408" font-size="21" font-family="Helvetica, Arial, sans-serif" fill="#374151">Each counter gets its own cache-line-sized slot.</text>

  <line x1="925" y1="485" x2="925" y2="575" stroke="#0f766e" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <line x1="1040" y1="485" x2="1040" y2="575" stroke="#0f766e" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <line x1="1155" y1="485" x2="1155" y2="575" stroke="#0f766e" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <line x1="1270" y1="485" x2="1270" y2="575" stroke="#0f766e" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="875" y="630" font-size="24" font-family="Helvetica, Arial, sans-serif" fill="#0f766e">Most writes stay local, so throughput recovers.</text>

  <rect x="120" y="720" width="1260" height="240" rx="22" fill="#111827"/>
  <text x="160" y="785" font-size="30" font-family="Helvetica, Arial, sans-serif" fill="#ffffff">Key point</text>
  <text x="160" y="845" font-size="24" font-family="Helvetica, Arial, sans-serif" fill="#d1d5db">False sharing is hard because the code looks independent.</text>
  <text x="160" y="885" font-size="24" font-family="Helvetica, Arial, sans-serif" fill="#d1d5db">The bug is not in synchronization semantics.</text>
  <text x="160" y="925" font-size="24" font-family="Helvetica, Arial, sans-serif" fill="#d1d5db">The problem is that memory layout places multiple hot writes on one cache line.</text>

  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
