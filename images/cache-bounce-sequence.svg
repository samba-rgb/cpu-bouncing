<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="100%" height="100%" fill="#fffdf7"/>
  <text x="70" y="70" font-size="34" font-family="Helvetica, Arial, sans-serif" fill="#111827">How One Shared Atomic Bounces Between Cores</text>
  <text x="70" y="105" font-size="18" font-family="Helvetica, Arial, sans-serif" fill="#4b5563">Each increment is correct. The cost comes from repeatedly moving write ownership.</text>

  <rect x="90" y="180" width="240" height="470" rx="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="165" y="225" font-size="28" font-family="Helvetica, Arial, sans-serif" fill="#1d4ed8">Core 0</text>
  <rect x="130" y="270" width="160" height="90" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="160" y="322" font-size="24" font-family="Helvetica, Arial, sans-serif" fill="#111827">Line X = M</text>
  <text x="142" y="347" font-size="16" font-family="Helvetica, Arial, sans-serif" fill="#4b5563">Core 0 owns the line</text>

  <rect x="480" y="180" width="240" height="470" rx="24" fill="#f9fafb" stroke="#6b7280" stroke-width="3"/>
  <text x="530" y="225" font-size="28" font-family="Helvetica, Arial, sans-serif" fill="#374151">Interconnect</text>
  <text x="525" y="325" font-size="20" font-family="Helvetica, Arial, sans-serif" fill="#374151">invalidation</text>
  <text x="540" y="410" font-size="20" font-family="Helvetica, Arial, sans-serif" fill="#374151">ownership</text>
  <text x="538" y="438" font-size="20" font-family="Helvetica, Arial, sans-serif" fill="#374151">transfer</text>
  <text x="540" y="520" font-size="20" font-family="Helvetica, Arial, sans-serif" fill="#374151">acknowledge</text>

  <rect x="870" y="180" width="240" height="470" rx="24" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
  <text x="945" y="225" font-size="28" font-family="Helvetica, Arial, sans-serif" fill="#e11d48">Core 1</text>
  <rect x="910" y="270" width="160" height="90" rx="16" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="940" y="322" font-size="24" font-family="Helvetica, Arial, sans-serif" fill="#111827">Line X = I</text>
  <text x="926" y="347" font-size="16" font-family="Helvetica, Arial, sans-serif" fill="#4b5563">Core 1 needs to write</text>

  <line x1="300" y1="410" x2="480" y2="410" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="320" y="390" font-size="18" font-family="Helvetica, Arial, sans-serif" fill="#1d4ed8">Core 0 currently owns line X</text>

  <line x1="870" y1="470" x2="720" y2="470" stroke="#e11d48" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="725" y="455" font-size="18" font-family="Helvetica, Arial, sans-serif" fill="#e11d48">Core 1 requests write ownership</text>

  <line x1="720" y1="555" x2="870" y2="555" stroke="#0f766e" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="725" y="540" font-size="18" font-family="Helvetica, Arial, sans-serif" fill="#0f766e">Ownership granted, Core 0 invalidated</text>

  <rect x="90" y="680" width="1020" height="45" rx="12" fill="#111827"/>
  <text x="120" y="709" font-size="18" font-family="Helvetica, Arial, sans-serif" fill="#ffffff">If both cores keep incrementing the same atomic, this transfer can happen millions of times. Throughput drops not because the code is incorrect, but because the line keeps changing owners.</text>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
